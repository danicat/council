apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: council-of-ancients
  labels:
    cloud.googleapis.com/location: REGION_PLACEHOLDER
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/sessionAffinity: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: council-of-ancients-sa@PROJECT_ID_PLACEHOLDER.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - name: council-of-ancients
          image: REGION_PLACEHOLDER-docker.pkg.dev/PROJECT_ID_PLACEHOLDER/council/council-of-ancients:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID_PLACEHOLDER"
            - name: GOOGLE_CLOUD_LOCATION
              value: "global"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: MODEL_ARMOR_PROMPT_TEMPLATE
              value: "projects/PROJECT_ID_PLACEHOLDER/locations/REGION_PLACEHOLDER/templates/council-prompt-screening"
            - name: MODEL_ARMOR_RESPONSE_TEMPLATE
              value: "projects/PROJECT_ID_PLACEHOLDER/locations/REGION_PLACEHOLDER/templates/council-response-screening"
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
